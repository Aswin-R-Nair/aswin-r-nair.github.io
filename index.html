<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css">
  <title>Aswin</title>
  <link rel="stylesheet" href="koi-pond.css">
  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #f0efef;
      color: #1f1f1f;
      padding: 3rem 1.5rem;
    }

    header {
      text-align: center;
      max-width: 40rem;
      margin: 0 auto 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #b8b8b8;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 3rem;
    }

    header p {
      margin: 0;
    }

    nav {
      max-width: 40rem;
      margin: 0 auto;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    nav li + li {
      margin-top: 0.75rem;
    }

    .nav-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: baseline;
    }

    .nav-label {
      font-weight: 500;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .koi-pond {
      height: clamp(18rem, 30vw + 8rem, 34rem);
      margin-top: 2.5rem;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
    }

    [data-theme="dark"] body {
      background: #161616;
      color: #e4e4e4;
    }

    [data-theme="dark"] header {
      border-bottom-color: #3d3d3d;
    }

    [data-theme="dark"] a {
      color: #9ea2ff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Aswin R Nair</h1>
    <p>I love learning how things work. So far its been about things in space, but now I'm looking at AI and what we can learn to make them safe!</p>
  </header>

  <nav aria-label="Main navigation">
    <ul>
      <li class="nav-row">
        <span class="nav-label">Pages:</span>
        <span class="nav-links">
          <a href="about.html">About me</a>
          <a href="research.html">Research</a>
        </span>
      </li>
      <li class="nav-row">
        <span class="nav-label">Links:</span>
        <span class="nav-links">
          <a href="https://github.com/aswin-r-nair" target="_blank" rel="noreferrer">GitHub</a>
          <a href="https://linkedin.com/in/nair-r-aswin" target="_blank" rel="noreferrer">LinkedIn</a>
          <a href="https://aswinrnair.substack.com" target="_blank" rel="noreferrer">Substack</a>
        </span>
      </li>
    </ul>
  </nav>

  <div class="koi-pond">
    <p class="koi-pond__hint">Click in the pond to feed ascii koi</p>
  </div>
  <script src="koi-pond.js"></script>
  <script>createKoiPond(document.querySelector('.koi-pond'));</script>
</body>
</html>
